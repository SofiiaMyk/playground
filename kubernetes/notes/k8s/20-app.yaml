apiVersion: v1
kind: ConfigMap
metadata:
  name: notes-config
  namespace: notes
data:
  DB_HOST: postgres        # the Service name, resolved by cluster DNS
  DB_NAME: notes
  DB_USER: notes
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-api
  namespace: notes
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notes-api
  template:
    metadata:
      labels:
        app: notes-api
    spec:
      containers:
        - name: api
          image: notes-api:v2
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: notes-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: notes-api
  namespace: notes
spec:
  selector:
    app: notes-api
  ports:
    - port: 80
      targetPort: 8000