apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: notes
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:SofiiaMyk/playground.git
    targetRevision: main
    path: kubernetes/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: notes
  syncPolicy:
    automated:
      prune: true       # delete things removed from Git
      selfHeal: true    # revert manual changes in the cluster
    syncOptions:
      - CreateNamespace=true
