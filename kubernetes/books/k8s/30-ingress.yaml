apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: books
  namespace: books
spec:
  ingressClassName: nginx
  rules:
    - host: books.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: books-api
                port:
                  number: 80